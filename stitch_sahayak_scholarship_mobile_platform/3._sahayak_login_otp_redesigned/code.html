<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sahayak - Login &amp; OTP</title><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#14533D',
              dark: '#0e3a2b',
              light: '#2d6a4f'
            },
            cream: {
              DEFAULT: '#FAF8F5',
              dark: '#F3EFEA'
            },
            brandOrange: '#F97316'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-decorations">
    /* Subtle custom wave/hills clip path */
    .bg-hills {
      background: radial-gradient(circle at 50% 120%, #A3C9A8 0%, #D8E2DC 45%, #F4F7F4 85%);
    }
    .shadow-sheet {
      box-shadow: 0 -10px 30px -5px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased font-sans">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[393px] h-[852px] bg-[#FAF8F5] rounded-[44px] shadow-2xl overflow-hidden relative border-[8px] border-slate-900 flex flex-col justify-between select-none">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full px-7 pt-3.5 pb-2 flex justify-between items-center z-20" data-purpose="status-bar">
<span class="text-sm font-semibold tracking-tight text-slate-900">9:41</span>
<div class="flex items-center space-x-2 text-slate-900">
<!-- Signal Strength Indicator -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 18 14">
<path d="M1 10.5h2.5v3.5H1v-3.5zm4.5-3.5H8v7H5.5V7zm4.5-3.5H12v10.5H10V3.5zm4.5-3.5h2.5v14h-2.5V0z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 2.5c2.8 0 5.3 1.1 7.2 3l-1.4 1.4C12.2 5.3 10.2 4.5 8 4.5s-4.2.8-5.8 2.4L.8 5.5C2.7 3.6 5.2 2.5 8 2.5zM4 6.7c1.1-.9 2.5-1.4 4-1.4s2.9.5 4 1.4l-1.4 1.4c-.7-.5-1.6-.9-2.6-.9s-1.9.4-2.6.9L4 6.7zm2.5 2.8C6.9 9.2 7.4 9 8 9s1.1.2 1.5.5L8 11.2 6.5 9.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="h-full w-4 bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopBar -->
<nav class="px-6 py-1 flex items-center z-10" data-purpose="top-navigation">
<button aria-label="Go back" class="p-1.5 -ml-1.5 text-slate-700 hover:text-slate-950 transition-colors" type="button">
<svg class="w-6 h-6 stroke-[2.2] stroke-current fill-none" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: TopBar -->
<!-- Scrollable Top/Mid Content Area -->
<div class="flex-1 overflow-y-auto px-6 pb-2 z-10 flex flex-col justify-start">
<!-- BEGIN: BrandHeader -->
<section class="flex flex-col items-center mt-1 mb-2" data-purpose="brand-heading"><div class="w-11 h-11 rounded-2xl bg-white border border-slate-200/80 shadow-xs flex items-center justify-center mb-2"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="6" fill="#F97316" r="2.5"></circle><path d="M6 17C6 12.5 12 11 12 11C12 11 12 17.5 8 19C6.8 19.5 6 18.5 6 17Z" fill="#14533D"></path><path d="M18 17C18 12.5 12 11 12 11C12 11 12 17.5 16 19C17.2 19.5 18 18.5 18 17Z" fill="#2E7D32"></path></svg></div><div class="flex items-center space-x-1.5"><h1 class="text-2xl font-bold text-[#14533D] tracking-tight">Sahayak</h1><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-[#E5EFE7] text-[#14533D]">Gov</span></div></section>
<!-- END: BrandHeader -->
<!-- BEGIN: WelcomeIllustrationSection -->
<section class="mb-5 mt-1 text-center px-2" data-purpose="hero-banner"><h2 class="text-xl leading-tight font-bold text-slate-900 tracking-tight">Welcome to Sahayak</h2><p class="text-xs text-slate-500 mt-1.5 leading-normal font-normal max-w-[260px] mx-auto">Manage and track your scholarships and disbursements in one place.</p></section>
<!-- END: WelcomeIllustrationSection -->
<!-- BEGIN: MobileLoginForm -->
<section class="space-y-3" data-purpose="phone-input-section">
<label class="block text-xs font-semibold text-slate-500" for="phone-input">Mobile number</label>
<!-- Input Field with Country Code -->
<div class="relative flex items-center border border-slate-300 rounded-xl bg-white px-3 py-2.5 focus-within:ring-2 focus-within:ring-forest focus-within:border-forest transition-all shadow-sm">
<div class="flex items-center space-x-1.5 pr-2.5 border-r border-slate-200 cursor-pointer">
<!-- Indian Flag -->
<div class="w-6 h-4 rounded-sm overflow-hidden flex flex-col shadow-xs border border-slate-100">
<div class="h-1/3 bg-[#FF9933]"></div>
<div class="h-1/3 bg-white flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-[#000080]"></div>
</div>
<div class="h-1/3 bg-[#138808]"></div>
</div>
<span class="text-sm font-semibold text-slate-800 tracking-tight">+91</span>
<svg class="w-3.5 h-3.5 text-slate-400 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-3 py-0 border-0 focus:ring-0 text-sm font-medium text-slate-900 tracking-wide placeholder-slate-400 bg-transparent" id="phone-input" placeholder="Enter mobile number" type="tel" value="98765 43210">
</div>
<!-- Primary CTA: Send OTP -->
<button class="w-full bg-[#14533D] hover:bg-[#0e3a2b] text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm flex items-center justify-center space-x-1" type="button">
<span>Send OTP</span>
</button>
<!-- Divider with 'or' -->
<div class="relative py-1 flex items-center justify-center">
<div class="border-t border-slate-200 w-full"></div>
<span class="bg-[#FAF8F5] px-3 text-[11px] font-normal text-slate-400 tracking-wider absolute">or</span>
</div>
<!-- Secondary CTA: Google Auth -->
<button class="w-full bg-white hover:bg-slate-50 border border-slate-300 py-2.5 rounded-xl font-medium text-xs text-slate-700 transition flex items-center justify-center space-x-2.5 shadow-xs" type="button">
<!-- Google 'G' Icon -->
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.66-5.17 3.66-9.12z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.13C3.26 21.36 7.36 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.13z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.13c.95-2.83 3.6-4.96 6.72-4.96z" fill="#EA4335"></path>
</svg>
<span class="font-medium text-slate-800">Continue with Google</span>
</button>
</section>
<!-- END: MobileLoginForm -->
</div>
<!-- BEGIN: OTPBottomSheet -->
<section class="bg-white rounded-t-[32px] pt-3 px-6 pb-6 shadow-sheet z-20 border-t border-slate-200/70 flex flex-col justify-end" data-purpose="otp-verification-modal"><div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3.5"></div><div class="flex items-center justify-between mb-2"><button aria-label="Dismiss OTP step" class="text-slate-600 hover:text-slate-900 p-1 -ml-1 transition-colors" type="button"><svg class="w-5 h-5 stroke-[2.2] stroke-current" fill="none" viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><h3 class="text-base font-bold text-slate-900 text-center flex-1 pr-4">Enter OTP</h3></div><div class="text-center px-4 mb-4"><p class="text-xs text-slate-500 font-normal leading-relaxed">We've sent a 6-digit code to <br><span class="font-semibold text-slate-800">+91 98765 43210</span></p></div><div class="flex justify-between items-center gap-2 px-1 mb-4" data-purpose="otp-digits-container"><div class="w-11 h-12 rounded-xl border-2 border-[#14533D] bg-white flex items-center justify-center font-bold text-lg text-slate-900 shadow-xs">1</div><div class="w-11 h-12 rounded-xl border border-slate-200 bg-slate-50/60 flex items-center justify-center font-bold text-lg text-slate-900 shadow-xs">2</div><div class="w-11 h-12 rounded-xl border border-slate-200 bg-slate-50/60 flex items-center justify-center font-bold text-lg text-slate-900 shadow-xs">3</div><div class="w-11 h-12 rounded-xl border border-slate-200 bg-slate-50/60 flex items-center justify-center font-bold text-lg text-slate-900 shadow-xs">4</div><div class="w-11 h-12 rounded-xl border border-slate-200 bg-slate-50/60 flex items-center justify-center font-bold text-lg text-slate-900 shadow-xs">5</div><div class="w-11 h-12 rounded-xl border border-slate-200 bg-slate-50/60 flex items-center justify-center font-bold text-lg text-slate-900 shadow-xs">6</div></div><p class="text-center text-xs text-slate-500">Didn't receive OTP? <a class="font-semibold text-[#14533D] hover:underline focus:outline-none ml-0.5" href="#resend">Resend (00:45)</a></p><div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div></section>
<!-- END: OTPBottomSheet -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
